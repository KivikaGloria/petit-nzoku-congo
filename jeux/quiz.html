<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Congo-Brazzaville - Petit Nzoku</title>
    <!-- Affiche à l'écran toute erreur JavaScript (utile sur téléphone) -->
    <script>
    window.onerror = function (msg, src, ligne) {
        var d = document.createElement('div');
        d.style.cssText = 'background:#e3211c;color:#fff;padding:12px;font:14px monospace;position:relative;z-index:99';
        d.textContent = '⚠️ ' + msg + ' (' + String(src).split('/').pop() + ', ligne ' + ligne + ')';
        document.addEventListener('DOMContentLoaded', function () { document.body.prepend(d); });
        if (document.body) document.body.prepend(d);
    };
    </script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <header>
        <h1>❓ Quiz du Congo-Brazzaville</h1>
        <p>Trouve la bonne réponse et deviens incollable sur ton pays !</p>
    </header>

    <main>
        <div class="quiz-container">

            <!-- Zone de quiz : visible dès l'arrivée (plus de choix de niveau) -->
            <div id="zone-quiz" class="zone-quiz">

                <!-- En-tête du quiz -->
                <div class="quiz-header">
                    <div class="score-box">
                        <span class="score-label">Score</span>
                        <span class="score-valeur" id="score">0</span>
                        <span class="score-max" id="total-questions">15</span>
                    </div>

                    <div class="etoiles-box" id="etoiles">★★★★★</div>

                    <div class="question-number">
                        Question <span id="question-actuelle">1</span>/<span id="total-questions2">15</span>
                    </div>
                </div>

                <!-- Question et image -->
                <div class="question-box">
                    <h2 id="question">Chargement de la question…</h2>

                    <div class="question-image" id="question-image">
                        <img src="" alt="Image de la question" id="image-question" style="display: none;">
                    </div>
                </div>

                <!-- Réponses (générées par JavaScript) -->
                <div class="reponses" id="reponses"></div>

                <!-- Feedback (généré par JavaScript) -->
                <div class="feedback" id="feedback" style="display: none;"></div>

                <!-- Bouton suivant -->
                <button id="btn-suivant" class="bouton" style="display: none;">Question suivante</button>

                <!-- Options d'accessibilité -->
                <div class="options-accessibilite">
                    <h3>🌍 Options pour tous les enfants</h3>

                    <div class="option-grille">
                        <div class="option">
                            <label class="switch-label" for="mode-picto">
                                <span class="option-emoji">🖼️</span> Pictogrammes
                            </label>
                            <label class="switch">
                                <input type="checkbox" id="mode-picto">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="option">
                            <label class="switch-label" for="mode-son">
                                <span class="option-emoji">🔊</span> Sons
                            </label>
                            <label class="switch">
                                <input type="checkbox" id="mode-son" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <!-- Le clic est géré dans quiz.js (pas de onclick ici, sinon la question est lue 2 fois) -->
                        <div class="option">
                            <button id="btn-lire" class="bouton-icone" type="button">
                                <span class="option-emoji">🗣️</span> Lire la question
                            </button>
                        </div>

                        <!-- Pas encore programmés : désactivés pour éviter les erreurs -->
                        <div class="option">
                            <button id="btn-micro" class="bouton-icone" type="button" disabled>
                                <span class="option-emoji">🎤</span> Répondre au micro (bientôt)
                            </button>
                        </div>

                        <div class="option">
                            <button id="btn-lsf" class="bouton-icone" type="button" disabled>
                                <span class="option-emoji">🤟</span> Langue des signes (bientôt)
                            </button>
                        </div>
                    </div>
                </div>

            </div> <!-- Fin zone-quiz -->

        </div>
    </main>

    <footer>
        <a href="../index.html" class="bouton">← Retour à l'accueil</a>
    </footer>

    <!-- Un seul fichier : questions + logique -->
    <script src="quiz.js?v=4"></script>
</body>
</html>
