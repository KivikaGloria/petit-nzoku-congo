<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory des animaux - Petit Nzoku</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="memory-animaux.css">
    <link rel="stylesheet" href="memory-animaux-plus.css">
</head>
<body>
    <header>
        <h1>🐘 Memory des animaux du Congo</h1>
        <p>Trouve toutes les paires d'animaux !</p>
    </header>

    <main>
        <div class="memory-container">
            <!-- En-tête du jeu -->
            <div class="memory-header">
                <div class="niveau-box" id="niveau-display">Niveau 1 / 4</div>
                <div class="coups-box">Coups : <span id="coups">0</span></div>
            </div>

            <!-- Grille du memory (une seule !) : les cartes sont générées par JavaScript -->
            <div id="memory-grid" class="memory-grid" role="group" aria-label="Les cartes du memory"></div>

            <!-- Message : fait sur l'animal, félicitations -->
            <div class="message-felicitations" id="messageFelicitations" role="status" aria-live="polite" style="display: none;">
                <p id="messageTexte"></p>
            </div>

            <!-- Boutons -->
            <div class="memory-controles">
                <button id="btn-nouveau" class="bouton" type="button">🔄 Nouvelle partie</button>
                <button id="btn-niveau-suivant" class="bouton" type="button" style="display: none;">➡️ Niveau suivant</button>
            </div>

            <!-- Options d'accessibilité -->
            <div class="options-accessibilite">
                <h3>🖐️ Options</h3>
                <div class="option-grille">
                    <div class="option">
                        <label class="switch-label" for="mode-son">
                            <span class="option-emoji">🔊</span> Sons
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="mode-son" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="../index.html" class="bouton">← Retour à l'accueil</a>
    </footer>

    <script src="memory-animaux.js"></script>
</body>
</html>
