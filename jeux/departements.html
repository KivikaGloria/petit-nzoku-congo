<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Départements du Congo - Petit Nzoku</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="departements.css">
</head>
<body>
    <header>
        <h1>🗺️ Défi des Départements du Congo</h1>
        <p>Réponds à un maximum de questions en 60 secondes chrono !</p>
    </header>

    <main>
        <div class="quiz-container">
            <div class="quiz-header">
                <div class="score-box">
                    <span class="score-label">Score</span>
                    <span class="score-valeur" id="score">0</span>
                </div>
                
                <div id="chrono-conteneur">⏱️ Temps restant : <span id="temps">15</span>s</div>
                
                <div class="etoiles-box" id="etoiles">
                    </div>
            </div>

            <div class="barre-temps-container">
                <div class="barre-temps-progressive" id="barre-temps"></div>
            </div>

            <div class="question-box">
                <h2 id="question">Prêt pour le grand défi ?</h2>
                
                <div class="question-image" id="question-image">
                    <img src="" alt="Carte du département" id="image-question" style="display: none;">
                </div>
            </div>

            <div class="reponses" id="reponses">
                </div>

            <div class="feedback" id="feedback" style="display: none;">
                <div class="feedback-content">
                    <p id="feedback-message"></p>
                    <div class="feedback-explication">
                        <p id="explication" class="explication-texte"></p>
                    </div>
                </div>
            </div>

            <button id="btn-suivant" class="bouton" style="display: none;">Question suivante</button>

            <div class="options-accessibilite">
                <h3>🌍 Options pour tous les enfants</h3>
                
                <div class="option-grille">
                    <div class="option">
                        <label class="switch-label">
                            <span class="option-emoji">🖼️</span> Pictogrammes
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="mode-picto">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="option">
                        <label class="switch-label">
                            <span class="option-emoji">🔊</span> Sons
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="mode-son" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="option">
                        <button id="btn-lire" class="bouton-icone">
                            <span class="option-emoji">🗣️</span> Lire la question
                        </button>
                    </div>
                </div>
                
                <div class="message-signes" id="message-signes">
                    <p>🤟 Version langue des signes bientôt disponible</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="../index.html" class="bouton">← Retour à l'accueil</a>
    </footer>

    <script src="departements.js"></script>
</body>
</html>
