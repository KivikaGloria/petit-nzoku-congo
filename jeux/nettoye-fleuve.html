<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettoie le fleuve Congo - Petit Nzoku</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="nettoye-fleuve.css">
    <link rel="stylesheet" href="nettoye-fleuve-plus.css">
</head>
<body>
    <header>
        <h1>🌊 Nettoie le fleuve Congo</h1>
        <p>Aide à protéger notre environnement !</p>
    </header>

    <main>
        <div class="jeu-container">
            <!-- En-tête du jeu -->
            <div class="jeu-header">
                <div class="score-box">
                    <span class="score-label">Déchets collectés</span>
                    <span class="score-valeur" id="score">0</span>
                    <span class="score-max">/ <span id="total-dechets">4</span></span>
                </div>

                <div class="timer-box" id="timer">
                    ⏱️ <span id="temps">60</span>s
                </div>

                <div class="niveau-box">
                    Niveau <span id="niveau">1</span>
                </div>
            </div>

            <!-- Zone de jeu -->
            <div class="canvas-container">
                <canvas id="jeuCanvas" width="800" height="400" role="img"
                        aria-label="Le fleuve Congo avec des déchets qui flottent. Touche les déchets pour les ramasser."></canvas>
            </div>

            <!-- Messages éducatifs -->
            <div class="message-educatif" id="messageEducatif" role="status" aria-live="polite" style="display: none;">
                <p id="messageTexte"></p>
            </div>

            <!-- Boutons -->
            <div class="controles">
                <button id="btn-recommencer" class="bouton" type="button">🔄 Recommencer</button>
                <button id="btn-niveau-suivant" class="bouton" type="button" style="display: none;">➡️ Niveau suivant</button>
            </div>

            <!-- Conseils écologiques -->
            <div class="conseils-eco">
                <h3>🌍 Le savais-tu ?</h3>
                <p id="conseil">Clique sur les déchets pour nettoyer le fleuve !</p>
                <p class="note-estimations">Ces durées sont des estimations : elles changent selon le soleil, l'eau et la chaleur.</p>
            </div>

            <!-- Options d'accessibilité -->
            <div class="options-accessibilite">
                <h3>🖐️ Options</h3>
                <div class="option-grille">
                    <div class="option">
                        <label class="switch-label" for="mode-son">
                            <span class="option-emoji">🔊</span> Sons
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="mode-son" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="../index.html" class="bouton">← Retour à l'accueil</a>
    </footer>

    <script src="nettoye-fleuve.js"></script>
</body>
</html>
